
[pytest]

# Onde o pytest deve procurar os testes.
testpaths = tests

# Dia 7 — Configuração dos avisos das bibliotecas
#
# Os avisos abaixo vêm das bibliotecas, não do código do projeto.
# Eles foram identificados no roteiro e podem ser silenciados
# para manter a saída dos testes organizada.
#
# FastAPI 0.115.6 + Pydantic 2.13.3:
# Aviso gerado durante a construção dos schemas de resposta.
# Não exige alteração no código da aplicação.
#
# Python 3.14 + Starlette:
# Aviso relacionado ao uso de asyncio.iscoroutinefunction,
# que foi descontinuado nessa versão do Python.

filterwarnings =
    ignore::pydantic.warnings.UnsupportedFieldAttributeWarning
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
